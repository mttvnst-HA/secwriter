# SpecsIntact Modern — nginx reverse proxy
#
# Terminates TLS for the collab server (WebSocket + HTTP) and serves the
# static frontend build. Assumes the Node.js collab server is running on
# the same host with default ports (1234 WS, 1235 HTTP).
#
# Adapt paths, domain, and certificate locations to your environment.

# ── Log sanitization ────────────────────────────────────────────────────
# y-websocket v1 passes JWT tokens as ?token=<JWT> in WebSocket URLs.
# Without this map, tokens appear in access logs — a credential leak.
map $request_uri $sanitized_uri {
    ~^(?<path>[^?]*)\?.*token=[^&]+ "$path?token=[REDACTED]";
    default                          $request_uri;
}

log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $sanitized_uri $server_protocol" '
                     '$status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

# ── Upstreams ───────────────────────────────────────────────────────────
upstream collab_ws {
    server 127.0.0.1:1234;    # COLLAB_PORT — WebSocket (Yjs CRDT sync)
}

upstream collab_http {
    server 127.0.0.1:1235;    # COLLAB_HTTP_PORT — REST API
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────
server {
    listen 80;
    server_name collab.example.com;    # <-- change to your domain
    return 301 https://$host$request_uri;
}

# ── HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name collab.example.com;    # <-- change to your domain

    # TLS — replace with your certificate paths
    ssl_certificate     /etc/ssl/certs/collab.example.com.pem;
    ssl_certificate_key /etc/ssl/private/collab.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/collab-access.log sanitized;
    error_log  /var/log/nginx/collab-error.log;

    # ── WebSocket (Yjs CRDT sync) ───────────────────────────────────────
    # Client connects to: wss://collab.example.com/ws/<roomName>
    # Proxy strips /ws/ prefix → backend sees /<roomName>
    location /ws/ {
        proxy_pass http://collab_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long-lived — default 60s kills them.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # ── HTTP REST API (room CRUD, file upload/download) ─────────────────
    # Client calls: https://collab.example.com/api/rooms, /api/health, etc.
    # Proxy strips /api/ prefix → backend sees /rooms, /health, etc.
    location /api/ {
        proxy_pass http://collab_http/;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File uploads to /rooms/:id/upload — server limit is 8MB.
        client_max_body_size 10m;

        # Do NOT add CORS headers here — the Node.js server handles CORS
        # via SIM_COLLAB_ORIGIN. Duplicate headers cause browser errors.
    }

    # ── Static frontend (Vite build output) ─────────────────────────────
    location / {
        root /var/www/specsintact-modern/dist;    # <-- path to npm run build output
        try_files $uri $uri/ /index.html;

        # Cache static assets (JS/CSS have content hashes from Vite)
        location ~* \.(js|css|woff2?|svg|png|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
