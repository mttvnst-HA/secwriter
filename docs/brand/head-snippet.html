<!--
  SecWriter brand assets - drop this in <head> of index.html.
  Assumes files are served from site root. Adjust paths if you put them in /public/ or /assets/.
-->

<!-- Browser tab icons (favicon family) -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
<link rel="shortcut icon" href="/favicon.ico">

<!-- iOS home-screen bookmark -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- PWA install / Android home-screen -->
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0ea5e9">

<!-- Open Graph: link previews on Slack, LinkedIn, iMessage, Discord, Teams, etc. -->
<meta property="og:title" content="SecWriter">
<meta property="og:description" content="Real-time collaborative .SEC editor for UFGS specifications.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://secwriter-frontend.onrender.com">
<meta property="og:image" content="https://secwriter-frontend.onrender.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="SecWriter - Real-time collaborative .SEC editor for UFGS specifications">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SecWriter">
<meta name="twitter:description" content="Real-time collaborative .SEC editor for UFGS specifications.">
<meta name="twitter:image" content="https://secwriter-frontend.onrender.com/og-image.png">
