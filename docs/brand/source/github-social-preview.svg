<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg2)"/>
  <rect width="1280" height="640" fill="url(#grid2)"/>

  <circle cx="260" cy="290" r="200" fill="#0ea5e9" opacity="0.12"/>

  <g transform="translate(130, 175)">
    <rect width="240" height="240" rx="48" fill="#0ea5e9"/>
    <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="63" y="161" font-size="126">&lt;</text>
      <text x="120" y="161" font-size="126">/</text>
      <text x="177" y="161" font-size="126">&gt;</text>
    </g>
  </g>

  <text x="420" y="280" font-size="100" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">SecWriter</text>
  <text x="420" y="340" font-size="28" font-weight="400" fill="#94a3b8">Real-time collaborative .SEC editor</text>
  <text x="420" y="378" font-size="28" font-weight="400" fill="#94a3b8">for UFGS specifications</text>

  <g transform="translate(420, 440)" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500">
    <g>
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
      <text x="85" y="23" fill="#38bdf8" text-anchor="middle">live collaboration</text>
    </g>
    <g transform="translate(184, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
      <text x="75" y="23" fill="#38bdf8" text-anchor="middle">track changes</text>
    </g>
    <g transform="translate(348, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
      <text x="90" y="23" fill="#38bdf8" text-anchor="middle">UFS 1-300-02 checks</text>
    </g>
  </g>

  <text x="130" y="595" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#64748b">github.com/mttvnst-HA/secwriter</text>
</svg>
