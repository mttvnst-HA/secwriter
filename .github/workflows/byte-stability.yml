name: Byte Stability (weekly)

# pmdoc-html round-trip idempotency over every block in reference/UFGS_M/
# (tests/pmdoc-html-byte-stability.node-test.mjs, issue #47 sub-PR 1c gate).
# ~5 min of pure CPU — too slow for the per-PR gate in ci.yml, so it runs on
# a weekly schedule and on demand. It is platform-independent (no paths, no
# encoding), so ubuntu-latest is fine.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byte-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  byte-stability:
    name: pmdoc-html byte-stability (reference/UFGS_M)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:byte-stability
