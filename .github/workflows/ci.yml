name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref. On pull requests a newer push supersedes the
# previous run (cancel-in-progress); on main every push keeps its own run so
# the branch history stays fully covered.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every third-party action is pinned to a full commit SHA (tag in the
# trailing comment). A mutable tag can be re-pointed by a compromised
# upstream; a SHA cannot. The repo's Actions settings require SHA pinning,
# so an unpinned `uses:` fails at workflow load. Dependabot's
# github-actions ecosystem (.github/dependabot.yml) bumps the SHA + comment
# together.

# Least-privilege default for the GITHUB_TOKEN; jobs that need more
# (unit-tests' docs-currency check reads issue/PR state via `gh`) declare
# it explicitly below instead of relying on the implicit repo-wide default.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit & Compliance Tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Hocuspocus (@hocuspocus/server, #128) declares yjs/y-protocols as peer
      # deps so the server shares ONE hoisted yjs copy with the other CJS
      # modules — instanceof checks (and the broker's Y.XmlFragment branch) break
      # if a second non-deduped yjs slips in via a future Hocuspocus bump. Fail
      # CI if that happens. (ADR-0001 / ADR-0018.)
      - name: Assert single Yjs instance (Hocuspocus peer-dep pin)
        # Block scalar (|) is required: the inline node script contains "FAIL: "
        # (colon-space), which is illegal inside a YAML plain scalar and makes
        # GitHub reject the whole workflow with a startup_failure.
        run: |
          node -e "const {execSync}=require('child_process'); const out=execSync('npm ls yjs --all',{encoding:'utf8'}); const n=(out.match(/yjs@/g)||[]).length; const deduped=(out.match(/deduped/g)||[]).length; if (n - deduped > 1) { console.error(out); console.error('FAIL: '+n+' yjs refs, '+deduped+' deduped -> '+(n-deduped)+' real copies'); process.exit(1);} console.log('single yjs OK ('+n+' refs, '+deduped+' deduped)');"

      # Production build. The dev server (Vite + React.StrictMode) is what
      # every other job exercises; a build-only breakage (bad import, chunk
      # error) is invisible without this step. See .claude/rules/testing.md
      # rule #12 for the dev-vs-production-build caveat.
      - name: Production build (vite build)
        run: npm run build

      # Step names deliberately carry no test counts — the counts drift
      # (the Vitest suite tripled without this file noticing) and
      # tools/check-doc-counts.mjs only scans CLAUDE.md.
      - name: Vitest unit tests
        run: npm test

      - name: Compliance rule tests (Node runner)
        run: npm run test:compliance

      - name: Corpus tests (Node runner)
        run: npm run test:corpus

      - name: Server tests (Node runner)
        run: npm run test:server

      - name: UFGS tag coverage + structural tests (Node runner)
        run: npm run test:ufgs

      - name: Structural interop tests (Node runner)
        run: npm run test:interop

      - name: Docs currency check (issue refs, counts, versions)
        run: npm run docs:check-currency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  azure-integration:
    name: Azure Integration (Azurite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Azurite is Microsoft's in-memory Azure Storage emulator. We run it
      # as a Docker container (rather than a GHA `services:` entry) so we
      # can pass `--blobHost 0.0.0.0` — the default image binds loopback-
      # only, which isn't reachable from the job steps.
      - name: Start Azurite
        # @azure/storage-blob 12.31 sends x-ms-version: 2026-02-06, which
        # Azurite 3.34.0 (and its `latest` tag) doesn't know about and
        # rejects with 400 InvalidHeaderValue. --skipApiVersionCheck
        # bypasses that validation — the protocol is stable enough across
        # recent versions that the tested operations (container CRUD,
        # blob upload/download/lease, listBlobsFlat) work fine. --loose
        # is the older umbrella flag but does NOT imply API-version
        # skipping in 3.34.0, so keep both. -l /data gives Azurite a
        # writable workspace.
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.34.0 \
            azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck -l /data

      - name: Wait for Azurite
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:10000/ || echo 000)
            if [ "$code" != "000" ]; then
              echo "Azurite responded (HTTP $code) — ready"
              exit 0
            fi
            sleep 1
          done
          echo "Azurite failed to start"
          docker logs azurite || true
          exit 1

      - name: Azurite SDK sanity check
        # Runs the bare minimum SDK call before the test suite so a
        # connection/auth/API-version problem surfaces with a clear error,
        # not through node:test's "hook failed" wrapper.
        run: |
          node -e "
          const { BlobServiceClient } = require('@azure/storage-blob');
          const cs = process.env.AZURE_STORAGE_CONNECTION_STRING;
          const client = BlobServiceClient.fromConnectionString(cs);
          const container = client.getContainerClient('sanity-check');
          container.create()
            .then(() => { console.log('OK — container created'); return container.delete(); })
            .then(() => console.log('OK — cleanup complete'))
            .catch(err => {
              console.error('SDK sanity check failed:');
              console.error('  message:', err.message);
              console.error('  statusCode:', err.statusCode);
              console.error('  code:', err.code);
              console.error('  details:', JSON.stringify(err.details || {}, null, 2));
              console.error('  responseBody:', err.response?.bodyAsText?.slice(0, 500));
              process.exit(1);
            });
          "
        env:
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"

      - name: Azurite integration tests (real @azure/storage-blob SDK)
        run: npm run test:azure:integration
        env:
          # Well-known Azurite connection string (devstoreaccount1 / public dev key).
          # This is NOT a secret — it's documented in the Azurite README and is
          # the fixed credential the emulator accepts for shared-key auth.
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"

      - name: Azurite logs (on failure)
        if: failure()
        run: docker logs azurite || true

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Chromium download is ~3.5 min on windows-latest; cache it keyed on the
      # exact @playwright/test version (each Playwright release pins its own
      # browser build, so a version bump is exactly when the cache must miss).
      # --with-deps only matters on Linux, so a cache hit skips install fully.
      - name: Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # 1i-b.2 (#47) — single-project gate. The chromium-legacy project
      # and the VITE_PM_EDITOR flag retired with this PR; PmEditableBlock
      # is the only editor.
      # Collab-server rate limits (SIM_RATE_LIMIT_*) and the E2E storage dir
      # are set in playwright.config.js webServer.env — the one place that
      # spawns the server, so local and CI runs get identical settings.
      - name: E2E tests (chromium)
        run: npx playwright test --project=chromium

      # Traces (on first retry), screenshots (on failure) and the HTML
      # report — see playwright.config.js `use`/`reporter`. Without this a
      # CI-only failure leaves nothing but the assertion line in the job log.
      - name: Upload Playwright traces + report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
