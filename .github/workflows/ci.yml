name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & Compliance Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Vitest unit tests (457 tests)
        run: npm test

      - name: Compliance rule tests (40 tests, Node runner)
        run: npm run test:compliance

      - name: Corpus tests (17 tests, Node runner)
        run: npm run test:corpus

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (140 tests)
        run: npm run test:e2e
        env:
          # Raise collab-server rate limits for E2E. Defaults (20 write/min,
          # 60 read/min, 10 ws/min) get exhausted quickly when 4 Playwright
          # workers each create/delete rooms, causing 429s on test retries.
          SIM_RATE_LIMIT_HTTP_WRITE_PER_MIN: '10000'
          SIM_RATE_LIMIT_HTTP_READ_PER_MIN: '10000'
          SIM_RATE_LIMIT_WS_PER_MIN: '10000'
